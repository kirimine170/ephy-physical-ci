---
# Safe examples only. Real public keys, password hashes, addresses, and USB serials
# belong in inventories/local/ or another access-controlled external source.
physical_ci_admin_authorized_keys: []
physical_ci_operator_authorized_keys: []
physical_ci_expected_devices: []

physical_ci_admin_password_hash: null
physical_ci_admin_sudo_nopasswd: false

physical_ci_manage_ssh: false
physical_ci_manage_firewall: false
physical_ci_service_deploy: false
physical_ci_toolchains_install: false

# Remote CI remains disabled until this host is registered to a dedicated
# private control repository with a short-lived token supplied outside Git．
physical_ci_github_runner_install: false
physical_ci_github_runner_enabled: false
physical_ci_github_runner_control_repository_private: false
physical_ci_github_runner_repository_url: ""
# Enable only when the host has no usable IPv6 route and the .NET runner times
# out before registration despite successful IPv4 GitHub connectivity.
physical_ci_github_runner_disable_ipv6: false

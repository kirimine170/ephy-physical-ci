---
- name: Validate the optional service declaration
  ansible.builtin.assert:
    that:
      - physical_ci_agent_command | length > 0
      - physical_ci_agent_command.startswith("/")
    fail_msg: An absolute physical_ci_agent_command is required before service deployment.
  when: physical_ci_service_deploy | bool

- name: Install the optional Physical CI agent unit
  ansible.builtin.template:
    src: ephy-physical-ci-agent.service.j2
    dest: /etc/systemd/system/ephy-physical-ci-agent.service
    owner: root
    group: root
    mode: "0644"
  register: physical_ci_service_unit
  when: physical_ci_service_deploy | bool

- name: Reload systemd after an optional unit change
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - physical_ci_service_deploy | bool
    - physical_ci_service_unit.changed

- name: Keep the optional service in the explicitly requested state
  ansible.builtin.systemd_service:
    name: ephy-physical-ci-agent.service
    enabled: "{{ physical_ci_service_enabled | bool }}"
    state: "{{ 'started' if physical_ci_service_enabled | bool else 'stopped' }}"
  when:
    - physical_ci_service_deploy | bool
    - physical_ci_service_manage_state | bool

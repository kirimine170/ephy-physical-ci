---
- name: Read the reserved Physical CI group ID
  ansible.builtin.command:
    argv:
      - getent
      - group
      - "{{ physical_ci_group_gid | string }}"
  register: physical_ci_group_gid_lookup
  changed_when: false
  failed_when: physical_ci_group_gid_lookup.rc not in [0, 2]
  check_mode: false

- name: Require the reserved group ID to be free or correctly assigned
  ansible.builtin.assert:
    that:
      - >-
        physical_ci_group_gid_lookup.stdout | length == 0 or
        physical_ci_group_gid_lookup.stdout.split(':')[0] == physical_ci_group
    fail_msg: "GID {{ physical_ci_group_gid }} is already assigned to another group."

- name: Read the reserved Physical CI user IDs
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ item.uid | string }}"
  loop:
    - name: "{{ physical_ci_admin_user }}"
      uid: "{{ physical_ci_admin_uid }}"
    - name: "{{ physical_ci_operator_user }}"
      uid: "{{ physical_ci_operator_uid }}"
    - name: "{{ physical_ci_agent_user }}"
      uid: "{{ physical_ci_agent_uid }}"
  loop_control:
    label: "{{ item.name }}={{ item.uid }}"
  register: physical_ci_uid_lookups
  changed_when: false
  failed_when: physical_ci_uid_lookups.rc not in [0, 2]
  check_mode: false

- name: Require reserved user IDs to be free or correctly assigned
  ansible.builtin.assert:
    that:
      - >-
        item.stdout | length == 0 or
        item.stdout.split(':')[0] == item.item.name
    fail_msg: "UID {{ item.item.uid }} is already assigned to another account."
  loop: "{{ physical_ci_uid_lookups.results }}"
  loop_control:
    label: "{{ item.item.name }}={{ item.item.uid }}"

- name: Require production credentials before a real account apply
  ansible.builtin.assert:
    that:
      - physical_ci_admin_authorized_keys | length > 0
      - physical_ci_operator_authorized_keys | length > 0
      - physical_ci_admin_password_hash or physical_ci_admin_sudo_nopasswd | bool
    fail_msg: >-
      A real apply requires administrator and operator public keys plus either an
      externally supplied administrator password hash or explicit NOPASSWD approval.
  when: not ansible_check_mode

- name: Create the dedicated Physical CI access group
  ansible.builtin.group:
    name: "{{ physical_ci_group }}"
    gid: "{{ physical_ci_group_gid }}"
    system: true
    state: present

- name: Create the administrator account without touching legacy users
  ansible.builtin.user:
    name: "{{ physical_ci_admin_user }}"
    uid: "{{ physical_ci_admin_uid }}"
    comment: Physical CI administrator
    create_home: true
    groups:
      - sudo
      - "{{ physical_ci_group }}"
    append: true
    shell: /bin/bash
    password: >-
      {{ physical_ci_admin_password_hash
         if physical_ci_admin_password_hash
         else omit }}
    update_password: on_create
    state: present

- name: Create the non-privileged operator account
  ansible.builtin.user:
    name: "{{ physical_ci_operator_user }}"
    uid: "{{ physical_ci_operator_uid }}"
    comment: Physical CI operator
    create_home: true
    groups:
      - "{{ physical_ci_group }}"
    append: true
    shell: /bin/bash
    password_lock: true
    state: present

- name: Create the non-interactive agent service account
  ansible.builtin.user:
    name: "{{ physical_ci_agent_user }}"
    uid: "{{ physical_ci_agent_uid }}"
    comment: Physical CI service account
    create_home: false
    group: "{{ physical_ci_group }}"
    home: /var/lib/ephy-physical-ci
    shell: /usr/sbin/nologin
    system: true
    password_lock: true
    state: present

- name: Refresh the account database after account declarations
  ansible.builtin.getent:
    database: passwd
  check_mode: false

- name: Install administrator SSH public keys
  ansible.posix.authorized_key:
    user: "{{ physical_ci_admin_user }}"
    key: "{{ item }}"
    state: present
    exclusive: false
    manage_dir: true
  loop: "{{ physical_ci_admin_authorized_keys }}"
  no_log: true
  when: physical_ci_admin_user in ansible_facts.getent_passwd

- name: Install operator SSH public keys
  ansible.posix.authorized_key:
    user: "{{ physical_ci_operator_user }}"
    key: "{{ item }}"
    state: present
    exclusive: false
    manage_dir: true
  loop: "{{ physical_ci_operator_authorized_keys }}"
  no_log: true
  when: physical_ci_operator_user in ansible_facts.getent_passwd

- name: Configure optional passwordless administrator sudo
  ansible.builtin.template:
    src: hil-admin-sudoers.j2
    dest: /etc/sudoers.d/90-hil-admin
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: physical_ci_admin_sudo_nopasswd | bool

- name: Remove the optional passwordless sudo rule when not approved
  ansible.builtin.file:
    path: /etc/sudoers.d/90-hil-admin
    state: absent
  when: not physical_ci_admin_sudo_nopasswd | bool

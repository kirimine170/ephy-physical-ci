name: Validate template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run template unit tests
        run: |
          python -m unittest discover -s tests -p 'test_init_repository.py' -v
          python -m unittest discover -s tests -p 'test_validate_repository.py' -v

      - name: Validate repository and scan template text
        run: python scripts/validate_repository.py --check-sensitive-patterns

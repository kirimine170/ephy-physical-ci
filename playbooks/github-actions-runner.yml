---
- name: Install the outbound Physical CI GitHub Actions runner
  hosts: physical_ci
  become: true
  gather_facts: true
  serial: 1

  pre_tasks:
    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version is version("24.04", ">=")
          - ansible_facts.distribution_version is version("25.04", "<")
        fail_msg: This playbook supports Ubuntu 24.04 LTS only.

  roles:
    - role: physical_ci_github_runner
    - role: physical_ci_service
      vars:
        physical_ci_agent_command: >-
          {{ (physical_ci_github_runner_disable_ipv6 | bool) |
             ternary('/usr/bin/env DOTNET_SYSTEM_NET_DISABLEIPV6=1 ', '') }}{{
             physical_ci_github_runner_root }}/run.sh
        physical_ci_service_deploy: >-
          {{ physical_ci_github_runner_install | bool }}
        physical_ci_service_enabled: >-
          {{ physical_ci_github_runner_enabled | bool }}
        physical_ci_service_manage_state: "{{ not ansible_check_mode }}"

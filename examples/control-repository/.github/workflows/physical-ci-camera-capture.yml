---
name: Physical CI camera capture

on:
  workflow_dispatch:
    inputs:
      infrastructure_revision:
        description: Reviewed ephy-physical-ci branch，tag，or commit
        required: true
        default: main
        type: string
      camera_revision:
        description: Reviewed ephy-cam branch，tag，or commit
        required: true
        default: main
        type: string
      retrieve_image:
        description: >-
          Create a short-lived private artifact for operator review
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: physical-ci-hil-01
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ github.event.repository.private == true }}
    runs-on:
      - self-hosted
      - linux
      - ephy-physical-ci
      - hil-01
    timeout-minutes: 15
    steps:
      - name: Check out the requested infrastructure revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: kirimine170/ephy-physical-ci
          ref: ${{ inputs.infrastructure_revision }}
          path: ephy-physical-ci
          persist-credentials: false

      - name: Check out the requested camera revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: kirimine170/ephy-cam
          ref: ${{ inputs.camera_revision }}
          path: ephy-cam
          persist-credentials: false

      - name: Capture and validate one QXGA JPEG
        env:
          JOB_ROOT: >-
            ${{ runner.temp }}/ephy-camera-${{ github.run_id }}-${{
            github.run_attempt }}
          SERIAL_DEVICE: ${{ secrets.PHYSICAL_CI_SERIAL_DEVICE }}
          RETRIEVE_IMAGE: ${{ inputs.retrieve_image }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${SERIAL_DEVICE}" ]]; then
            echo "PHYSICAL_CI_SERIAL_DEVICE is not configured" >&2
            exit 2
          fi
          case "${SERIAL_DEVICE}" in
            /dev/serial/by-id/*) ;;
            *)
              echo "The serial device must use /dev/serial/by-id" >&2
              exit 2
              ;;
          esac
          if [[ ! -L "${SERIAL_DEVICE}" ]]; then
            echo "The configured camera device is unavailable" >&2
            exit 1
          fi

          mkdir -p "${JOB_ROOT}/staging"
          ephy-physical-ci/scripts/run-camera-reference \
            "${GITHUB_WORKSPACE}/ephy-cam/reference/xiao-esp32s3-sense" \
            capture "${SERIAL_DEVICE}" "${JOB_ROOT}/staging" \
            >"${JOB_ROOT}/capture-result.json"
          capture_dir="$(
            python3 - "${JOB_ROOT}/capture-result.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["capture_dir"])
          PY
          )"
          case "${capture_dir}" in
            "${JOB_ROOT}/staging/"*) ;;
            *)
              echo "Capture escaped the isolated staging directory" >&2
              exit 2
              ;;
          esac

          ephy-physical-ci/scripts/validate-camera-artifacts \
            "${capture_dir}" "${GITHUB_WORKSPACE}/ephy-cam" \
            --source-id xiao-esp32s3-sense-01 \
            --width 2048 --height 1536
          python3 - \
            "${capture_dir}/validation.json" \
            "${GITHUB_STEP_SUMMARY}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              validation = json.load(handle)
          summary = (
              "Camera capture validated: "
              f"{validation['width']}x{validation['height']}，"
              f"{validation['size_bytes']} bytes\n"
          )
          with open(sys.argv[2], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY

          if [[ "${RETRIEVE_IMAGE}" == "true" ]]; then
            mapfile -d '' images < <(
              find "${capture_dir}" -maxdepth 1 -type f \
                \( -iname '*.jpg' -o -iname '*.jpeg' \) -print0
            )
            if [[ "${#images[@]}" -ne 1 ]]; then
              echo "Expected exactly one validated JPEG for retrieval" >&2
              exit 2
            fi
            mkdir -p "${JOB_ROOT}/export"
            install -m 0600 "${images[0]}" "${JOB_ROOT}/export/capture.jpg"
            install -m 0600 "${capture_dir}/validation.json" \
              "${JOB_ROOT}/export/validation.json"
          fi

      - name: Upload the requested image for private operator retrieval
        if: ${{ inputs.retrieve_image }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        env:
          ARTIFACT_ROOT: >-
            ${{ runner.temp }}/ephy-camera-${{ github.run_id }}-${{
            github.run_attempt }}/export
        with:
          name: ephy-camera-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ARTIFACT_ROOT }}/capture.jpg
            ${{ env.ARTIFACT_ROOT }}/validation.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove the captured image and isolated job state
        if: always()
        env:
          JOB_ROOT: >-
            ${{ runner.temp }}/ephy-camera-${{ github.run_id }}-${{
            github.run_attempt }}
        run: |
          set -Eeuo pipefail
          case "${JOB_ROOT}" in
            "${RUNNER_TEMP}/ephy-camera-"*) ;;
            *) echo "Refusing unsafe cleanup path" >&2; exit 2 ;;
          esac
          if [[ -d "${JOB_ROOT}" ]]; then
            find "${JOB_ROOT}" -mindepth 1 -delete
            rmdir "${JOB_ROOT}"
          fi
